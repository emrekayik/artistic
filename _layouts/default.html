<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-base-200">
    <header class="sticky top-0 z-50 border-b border-base-300/70 bg-base-100/90 backdrop-blur">
      <div class="navbar mx-auto w-[92%] max-w-6xl px-0">
        <div class="flex-1">
          <a class="btn btn-ghost text-lg font-bold" href="./">{{ site.title }}</a>
        </div>
        <div class="flex-none gap-1">
          <a href="#ozellikler" class="btn btn-ghost btn-sm">Özellikler</a>
          <a href="#hakkinda" class="btn btn-ghost btn-sm">Hakkında</a>
          <a href="#iletisim" class="btn btn-primary btn-sm">İletişim</a>
        </div>
      </div>
    </header>

    <main class="mx-auto w-[92%] max-w-6xl py-10">{{ content }}</main>

    <footer id="iletisim" class="footer footer-center border-t border-base-300 bg-base-100 px-6 py-8 text-base-content">
      <aside>
        <p>{{ site.title }} · Jekyll + TailwindCSS Ruby + DaisyUI</p>
      </aside>
    </footer>
  </body>
</html>
